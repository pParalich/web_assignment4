<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms Lab</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <h1>Forms Lab</h1>
        <!-- Task 0 -->
    <div id="task0">
      <h2>Task 0. Simple Contact Form</h2>

      <form class="simple-form" action="#" method="post">
        <label for="name0">Name</label>
        <input type="text" id="name0" name="name">

        <label for="email0">Email</label>
        <input type="email" id="email0" name="email">

        <label for="message0">Message</label>
        <textarea id="message0" name="message" rows="5" cols="40"></textarea>

        <button type="submit">Submit</button>
      </form>
    </div>
  

    <hr>
        <!-- Task 1 -->
    <div id="task1">
      <h2>Task 1. HTML5 Validation</h2>

      <form class="simple-form" action="#" method="post">
        <label for="name1">Name</label>
        <input type="text" id="name1" name="name" required minlength="2" maxlength="30">

        <label for="email1">Email</label>
        <input type="email" id="email1" name="email" required>

        <label for="message1">Message</label>
        <textarea id="message1" name="message" rows="5" cols="40" required minlength="10" maxlength="200"></textarea>

        <button type="submit">Submit</button>
      </form>
    </div>

    <hr>
        <!-- Task 2 -->
    <div id="task2">
      <h2>Task 2. Bootstrap Form</h2>

      <form action="#" method="post">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="name2" class="form-label">Name</label>
            <input type="text" class="form-control" id="name2" placeholder="Enter your name">
          </div>

          <div class="col-md-6 mb-3">
            <label for="email2" class="form-label">Email</label>
            <input type="email" class="form-control" id="email2" placeholder="Enter your email">
            <div class="form-text">We will never share your email.</div>
          </div>
        </div>

        <div class="mb-3">
          <label for="message2" class="form-label">Message</label>
          <textarea class="form-control" id="message2" rows="4" placeholder="Enter your message"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
    </div>

    <hr>
